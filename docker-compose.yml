name: hk-store-web

services:
  hk-store-web:
    image: hk-store-web
    build:
      context: .
      args:
        NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyAwy1_6C6_p_N-PxE2_NeSHerXpdXNpvqo"
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "lista-de-tareas-gnostica.firebaseapp.com"
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: "lista-de-tareas-gnostica"
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "lista-de-tareas-gnostica.firebasestorage.app"
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "53950811543"
        NEXT_PUBLIC_FIREBASE_APP_ID: "1:53950811543:web:892bcc7a08db5c89ae48d2"
    container_name: hk-store-web
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      - NODE_ENV=production
      - API_URL=http://192.168.1.133:3001/api

    volumes:
      - ./public:/app/public